<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">The life of the phone session</title>
  <desc id="fig2-desc">State sketch. Tapping Start signer or Pair requests permissions, starts the foreground service, advertises a 4-byte pairing code, and shows one ongoing notification titled Remote signer. Leaving the Signer screen, leaving the Bluetooth signer screen, and closing the activity do not stop the session. Tapping Stop signer, tapping Stop on the notification, or system destruction stops it. A force-stop ends the signer and Android does not let the app ignore it. After a normal app start the service returns if the signer was armed, with the same pairing code.</desc>
  <style>
    text { font-family: 'STIX Two Text', 'Times New Roman', Times, Georgia, serif; }
    .kicker { font-size: 10.5px; letter-spacing: 2.2px; fill: #3a3a3a; }
    .title { font-size: 29px; fill: #141414; }
    .sub { font-size: 13px; font-style: italic; fill: #5c5c5c; }
    .smallcaps { font-size: 10.5px; letter-spacing: 1.6px; fill: #2a2a2a; }
    .sm { font-size: 11.5px; fill: #2c2c2c; }
    .xs { font-size: 10.5px; fill: #444; }
    .ital { font-style: italic; fill: #5c5c5c; }
    .rule { stroke: #1e1e1e; stroke-width: 0.8; fill: none; }
    .hair { stroke: #8a8a8a; stroke-width: 0.7; fill: none; }
    .rail { stroke: #161616; stroke-width: 1.4; fill: none; }
    .ink { stroke: #161616; stroke-width: 1.2; fill: none; }
    .dash { stroke: #5a5a5a; stroke-width: 0.9; stroke-dasharray: 4 4; fill: none; }
    .dotted { stroke: #9a9a9a; stroke-width: 0.8; stroke-dasharray: 1 3; fill: none; }
  </style>
  <defs>
    <marker id="fig2-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#161616"/>
    </marker>
    <marker id="fig2-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#fbfaf6"/>

  <text class="kicker" x="60" y="42">ZIGNER · BLUETOOTH REMOTE SIGNER</text>
  <text class="kicker" x="940" y="42" text-anchor="end">FIG. 2</text>
  <text class="title" x="60" y="92">The life of the phone session</text>
  <text class="sub" x="60" y="116">Start, screen changes, activity close, notification, stop, force-stop. Not to scale.</text>
  <line class="rule" x1="60" y1="134" x2="940" y2="134"/>

  <!-- start column -->
  <text class="smallcaps" x="60" y="268">START SEQUENCE</text>
  <text class="sm" x="60" y="290">Tap Start signer or Pair</text>
  <text class="sm" x="60" y="310">Bluetooth + notification permission</text>
  <text class="sm" x="60" y="330">Foreground service starts</text>
  <text class="sm" x="60" y="350">Advertises 4-byte code</text>
  <text class="sm" x="60" y="370">Notification: “Remote signer”</text>

  <!-- rail -->
  <line class="rail" x1="80" y1="390" x2="800" y2="390"/>
  <circle cx="110" cy="390" r="5" fill="#fbfaf6" stroke="#161616" stroke-width="1.4"/>
  <text class="smallcaps" x="110" y="420" text-anchor="middle">START</text>

  <!-- running band -->
  <line class="ink" x1="280" y1="376" x2="560" y2="376"/>
  <line class="ink" x1="280" y1="412" x2="560" y2="412"/>
  <line class="ink" x1="280" y1="376" x2="280" y2="412"/>
  <line class="ink" x1="560" y1="376" x2="560" y2="412"/>
  <text class="smallcaps" x="420" y="392" text-anchor="middle">SESSION RUNNING</text>
  <text class="xs ital" x="420" y="406" text-anchor="middle">foreground service</text>

  <!-- what does not stop it -->
  <text class="xs" x="420" y="248" text-anchor="middle">Leaving the Signer screen</text>
  <text class="xs" x="420" y="266" text-anchor="middle">Leaving the Bluetooth signer screen</text>
  <text class="xs" x="420" y="284" text-anchor="middle">Closing the activity</text>
  <text class="xs ital" x="420" y="306" text-anchor="middle">connection stays</text>
  <line class="dotted" x1="420" y1="314" x2="420" y2="374"/>

  <!-- notification -->
  <text class="xs" x="300" y="442">Notification: “Remote signer”</text>
  <text class="xs ital" x="300" y="458">stays on the phone</text>

  <!-- stop triggers -->
  <text class="smallcaps" x="712" y="306" text-anchor="end">STOP TRIGGERS</text>
  <text class="xs" x="712" y="328" text-anchor="end">Stop signer</text>
  <text class="xs" x="712" y="346" text-anchor="end">Stop on notification</text>
  <text class="xs" x="712" y="364" text-anchor="end">system destroys service</text>
  <line class="rail" x1="560" y1="390" x2="726" y2="390" marker-end="url(#fig2-arrow)"/>
  <circle cx="740" cy="390" r="5" fill="#fbfaf6" stroke="#161616" stroke-width="1.4"/>
  <text class="smallcaps" x="740" y="420" text-anchor="middle">STOPPED</text>
  <text class="xs ital" x="740" y="440" text-anchor="middle">connection stops</text>

  <!-- force-stop branch -->
  <line class="ink" x1="470" y1="412" x2="470" y2="496" marker-end="url(#fig2-arrow)"/>
  <text class="xs" x="484" y="470">Force-stop the app</text>
  <text class="xs ital" x="484" y="486">ends the signer</text>
  <circle cx="470" cy="510" r="5" fill="#fbfaf6" stroke="#161616" stroke-width="1.4"/>
  <text class="smallcaps" x="470" y="540" text-anchor="middle">ENDED</text>
  <text class="xs ital" x="490" y="558">Android does not let an app ignore a force-stop.</text>

  <!-- same code -->
  <text class="xs ital" x="130" y="474">Same pairing code kept for the next start</text>

  <!-- normal restart -->
  <path class="dash" d="M470,522 V604 H110 V404" marker-end="url(#fig2-arrow-gray)"/>
  <text class="xs" x="150" y="596">normal app start</text>
  <text class="xs ital" x="150" y="620">service starts again if the signer was armed</text>

  <line class="rule" x1="60" y1="656" x2="940" y2="656"/>
  <text class="xs" x="60" y="676">The foreground service keeps the radio and the ongoing notification while the session runs. Screen changes and closing the activity do not stop it.</text>
  <text class="xs" x="60" y="694">Stop signer, Stop on the notification, service destruction, or a force-stop end it. After a normal start it returns if the signer was armed.</text>
</svg>
