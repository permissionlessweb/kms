<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">The four parts and the path of one signature</title>
  <desc id="fig1-desc">Schematic. The phone holds the consensus key. The laptop scanner pairs with the phone using a 4-byte code. The KMS console sends block bytes to the phone over Bluetooth and receives a signature, then answers the temporary node. A separate file-backed signer stays outside this path and is not connected to the phone. Solid lines carry the signature path; dashed lines mark pairing and the separate signer.</desc>
  <style>
    text { font-family: 'STIX Two Text', 'Times New Roman', Times, Georgia, serif; }
    .kicker { font-size: 10.5px; letter-spacing: 2.2px; fill: #3a3a3a; }
    .title { font-size: 29px; fill: #141414; }
    .sub { font-size: 13px; font-style: italic; fill: #5c5c5c; }
    .smallcaps { font-size: 10.5px; letter-spacing: 1.6px; fill: #2a2a2a; }
    .lbl { font-size: 14px; fill: #161616; }
    .sm { font-size: 11.5px; fill: #2c2c2c; }
    .xs { font-size: 10px; fill: #444; }
    .ital { font-style: italic; fill: #5c5c5c; }
    .id { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 11px; fill: #222; }
    .rule { stroke: #1e1e1e; stroke-width: 0.8; fill: none; }
    .hair { stroke: #8a8a8a; stroke-width: 0.6; fill: none; }
    .box { fill: #fbfaf6; stroke: #1a1a1a; stroke-width: 1.1; }
    .thinbox { fill: none; stroke: #6a6a6a; stroke-width: 0.7; }
    .ink { stroke: #161616; stroke-width: 1.25; fill: none; }
    .heavy { stroke: #161616; stroke-width: 1.8; fill: none; }
    .dash { stroke: #5a5a5a; stroke-width: 0.9; stroke-dasharray: 4 4; fill: none; }
    .dotted { stroke: #8a8a8a; stroke-width: 0.8; stroke-dasharray: 1 3; fill: none; }
  </style>
  <defs>
    <marker id="fig1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#161616"/>
    </marker>
    <marker id="fig1-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#fbfaf6"/>

  <text class="kicker" x="60" y="42">ZIGNER · BLUETOOTH REMOTE SIGNER</text>
  <text class="kicker" x="940" y="42" text-anchor="end">FIG. 1</text>
  <text class="title" x="60" y="92">The four parts and the path of one signature</text>
  <text class="sub" x="60" y="116">Schematic, not to scale. Solid ink is the signing path; dashed ink is pairing and the separate file-based signer.</text>
  <line class="rule" x1="60" y1="134" x2="940" y2="134"/>

  <!-- phone -->
  <text class="smallcaps" x="175" y="176" text-anchor="middle">PHONE</text>
  <rect class="box" x="80" y="190" width="190" height="320"/>
  <rect class="thinbox" x="94" y="204" width="162" height="292"/>
  <line class="hair" x1="150" y1="216" x2="200" y2="216"/>
  <text class="smallcaps" x="175" y="240" text-anchor="middle">ZIGNER APP</text>
  <text class="sm" x="175" y="262" text-anchor="middle">consensus key</text>
  <circle class="ink" cx="175" cy="298" r="8"/>
  <path class="ink" d="M175,306 V352 M175,330 h9 M175,342 h7"/>
  <text class="sm" x="175" y="378" text-anchor="middle">Ed25519</text>
  <text class="sm" x="175" y="398" text-anchor="middle">signs the block bytes</text>
  <text class="xs ital" x="175" y="454" text-anchor="middle">no Internet permission</text>

  <!-- laptop grouping -->
  <text class="smallcaps" x="505" y="180" text-anchor="middle">LAPTOP</text>
  <line class="hair" x1="380" y1="188" x2="630" y2="188"/>
  <line class="hair" x1="380" y1="188" x2="380" y2="198"/>
  <line class="hair" x1="630" y1="188" x2="630" y2="198"/>

  <!-- KMS console -->
  <rect class="box" x="380" y="200" width="250" height="240"/>
  <text class="smallcaps" x="396" y="220">KMS CONSOLE</text>
  <text class="id" x="396" y="242">http://127.0.0.1:8791</text>
  <text class="sm" x="396" y="270">asks the phone to sign</text>
  <text class="sm" x="396" y="296">checks the signature</text>
  <text class="sm" x="396" y="312">against the public key</text>

  <!-- scanner -->
  <rect class="box" x="380" y="470" width="250" height="70"/>
  <text class="smallcaps" x="396" y="488">LAPTOP SCANNER</text>
  <text class="sm" x="396" y="508">listens for the pairing code</text>
  <text class="sm" x="396" y="526">user taps Accept</text>

  <!-- node -->
  <text class="smallcaps" x="860" y="236" text-anchor="middle">TEMPORARY NODE</text>
  <rect class="box" x="780" y="250" width="160" height="180"/>
  <text class="id" x="796" y="272">temporary node</text>
  <text class="sm" x="796" y="316">asks for a signature</text>
  <text class="sm" x="796" y="380">moves to the next block</text>
  <text class="sm" x="796" y="396">only on a good signature</text>

  <!-- signing path: console -> phone request, phone -> console signature -->
  <line class="heavy" x1="380" y1="330" x2="270" y2="330" marker-end="url(#fig1-arrow)"/>
  <line class="heavy" x1="270" y1="360" x2="380" y2="360" marker-end="url(#fig1-arrow)"/>
  <text class="xs" x="325" y="322" text-anchor="middle">block bytes</text>
  <text class="xs ital" x="325" y="346" text-anchor="middle">Bluetooth</text>
  <text class="xs" x="325" y="375" text-anchor="middle">signature</text>

  <!-- public key, once -->
  <line class="dash" x1="270" y1="420" x2="380" y2="420" marker-end="url(#fig1-arrow-gray)"/>
  <text class="xs ital" x="325" y="412" text-anchor="middle">public key</text>

  <!-- pairing code -->
  <line class="dash" x1="270" y1="496" x2="380" y2="496" marker-end="url(#fig1-arrow-gray)"/>
  <text class="xs" x="325" y="486" text-anchor="middle">4-byte pairing code</text>
  <text class="xs ital" x="325" y="512" text-anchor="middle">phone sends no name</text>

  <!-- node request / signature return -->
  <line class="heavy" x1="780" y1="330" x2="630" y2="330" marker-end="url(#fig1-arrow)"/>
  <line class="heavy" x1="630" y1="360" x2="780" y2="360" marker-end="url(#fig1-arrow)"/>
  <text class="xs" x="705" y="322" text-anchor="middle">sign request</text>
  <text class="xs" x="705" y="375" text-anchor="middle">signature</text>

  <!-- live Morocco signer, outside the path -->
  <rect x="360" y="596" width="330" height="92" fill="none" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="6 4"/>
  <path class="hair" d="M378,614 h14 l8 8 v20 h-22 z M392,614 v8 h8"/>
  <text class="smallcaps" x="414" y="624">LIVE MOROCCO SIGNER</text>
  <text class="xs ital" x="414" y="642">outside this path</text>
  <text class="sm" x="414" y="662">uses a key file on the laptop</text>
  <text class="xs ital" x="414" y="679">do not point it at the phone</text>
  <line class="dash" x1="360" y1="650" x2="312" y2="650"/>
  <line class="ink" x1="312" y1="642" x2="312" y2="658"/>
  <text class="xs ital" x="304" y="638" text-anchor="end">not connected</text>

  <line class="rule" x1="60" y1="712" x2="940" y2="712"/>
  <text class="xs" x="60" y="730">Solid ink carries one signature: request, block bytes, signature, check. Dashed ink marks pairing and the separate signer.</text>
  <text class="xs" x="60" y="746">The temporary node cannot sign from its key file while the phone session is armed; the laptop log contains no private key.</text>
</svg>
